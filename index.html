        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 1000;
      }
      #header h1 {
        font-size: 22px;
        font-weight: 600;
      }
      #header .subtitle {
        font-size: 13px;
        opacity: 0.7;
        margin-top: 2px;
      }
      #legend {
        display: flex;
        gap: 20px;
        font-size: 13px;
      }
      #legend .item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.green {
        background: #4caf50;
      }
      .dot.orange {
        background: #ff9800;
      }
      .dot.gray {
        background: #9e9e9e;
      }
      #map {
        width: 100vw;
        height: calc(100vh - 60px);
      }
      .station-popup .leaflet-popup-content-wrapper {
        border-radius: 12px;
        padding: 4px;
      }
      .station-popup .leaflet-popup-content {
        margin: 10px 12px;
      }
      .popup-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .popup-line {
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      .popup-status {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        color: white;
        margin-top: 4px;
      }
      .popup-status.open {
        background: #4caf50;
      }
      .popup-status.building {
        background: #ff9800;
      }
      .popup-status.planned {
        background: #9e9e9e;
      }
      .progress-bar-container {
        margin-top: 8px;
        background: #e0e0e0;
        border-radius: 10px;
        height: 10px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #ff9800, #ffb74d);
        transition: width 0.5s ease;
      }
      .progress-text {
        font-size: 11px;
        color: #666;
        margin-top: 3px;
        text-align: right;
      }
      .popup-year {
        font-size: 11px;
        color: #888;
        margin-top: 6px;
      }
      .popup-note {
        font-size: 11px;
        color: #999;
        margin-top: 6px;
        border-top: 1px solid #eee;
        padding-top: 6px;
      }
      .leaflet-popup-content {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .accordion {
        margin-top: 8px;
      }
      .acc-item {
        border-bottom: 1px solid #f0f0f0;
      }
      .acc-item:last-child {
        border-bottom: none;
      }
      .acc-header {
        cursor: pointer;
        padding: 7px 10px;
        font-weight: 600;
        font-size: 12px;
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
        background: #f7f8fa;
        border-radius: 6px;
        margin-top: 4px;
        transition: background 0.15s;
      }
      .acc-header:hover {
        background: #eef0f4;
      }
      .acc-header .arrow {
        font-size: 9px;
        color: #999;
        transition: transform 0.2s;
      }
      .acc-item.open .acc-header .arrow {
        transform: rotate(90deg);
      }
      .acc-body {
        display: none;
        padding: 8px 4px 4px 4px;
      }
      .acc-item.open .acc-body {
        display: block;
      }

      .stage-item {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 0;
        border-bottom: 1px solid #f5f5f5;
      }
      .stage-item:last-child {
        border-bottom: none;
      }
      .stage-icon {
        flex-shrink: 0;
        font-size: 12px;
        line-height: 1.4;
      }
      .stage-text {
        color: #444;
        line-height: 1.4;
        flex: 1;
        font-size: 12px;
      }
      .stage-text a.stage-link {
        color: #1a73e8;
        text-decoration: none;
        border-bottom: 1px dotted rgba(26, 115, 232, 0.5);
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .stage-text a.stage-link:hover {
        color: #0d47a1;
        border-bottom-color: #0d47a1;
      }
      .stage-text a.stage-link .link-icon {
        font-size: 9px;
        opacity: 0.75;
        margin-left: 2px;
      }
      .stage-progress-wrap {
        margin-top: 4px;
      }
      .stage-progress-container {
        background: #e0e0e0;
        border-radius: 6px;
        height: 6px;
        overflow: hidden;
      }
      .stage-progress-fill {
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #ff9800, #ffb74d);

      .stage-progress-text {
        font-size: 10px;
        color: #888;
        margin-top: 2px;
        text-align: right;
      }

        font-size: 11px;
        color: #444;
        margin-top: 6px;
        padding: 6px 8px;
        background: #f5f5f5;
        border-radius: 6px;
      }
      .map-container {
        position: relative;
      }
      .footer {
        position: absolute;
        bottom: 0px;
        left: 0px;
        right: 0px;
        height: 40px;
        background: #1b2039;
        z-index: 10000;
      }

              ? item.progress
              : null;
          const src = typeof item === "object" && item.src ? item.src : null;

          let textHtml = text;
          if (src && SOURCES[src]) {
            textHtml = `<a class="stage-link" href="${SOURCES[src]}" target="_blank" rel="noopener noreferrer">${text}<span class="link-icon">🔗</span></a>`;
          }

          const progressHtml =
            progress != null
              ? `<div class="stage-progress-wrap">
                              <div class="stage-progress-container">
                                <div class="stage-progress-fill" style="width:${progress}%"></div>
                              </div>
                              <div class="stage-progress-text">${progress}%</div>
                            </div>`
              : "";

          return `<div class="stage-item">
                    <span class="stage-icon">${icon}</span>
                    <span class="stage-text">${textHtml}${progressHtml}</span>
                  </div>`;
        }

        if (stages.done && stages.done.length) {
          html += `<div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>✅ Выполнено (${stages.done.length})</span>
              <span class="arrow">▶</span>
            </div>
            <div class="acc-body">
              ${stages.done.map((item) => renderStageItem("✅", item)).join("")}
            </div>
          </div>`;
        }

        if (stages.current && stages.current.length) {
          html += `<div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>🔄 В работе (${stages.current.length})</span>
              <span class="arrow">▶</span>
            </div>
            <div class="acc-body">
              ${stages.current.map((item) => renderStageItem("🔄", item)).join("")}
            </div>
          </div>`;
        }

        if (stages.remaining && stages.remaining.length) {
          html += `<div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>📋 Предстоит (${stages.remaining.length})</span>
              <span class="arrow">▶</span>
            </div>
            <div class="acc-body">
              ${stages.remaining.map((item) => renderStageItem("📋", item)).join("")}
            </div>
          </div>`;
        }

        if (tunnelInfo) {
          let tHtml = "";
          if (tunnelInfo.left) {
            const t = tunnelInfo.left;
            tHtml += `<div class="stage-text" style="margin-bottom:6px;">
              Левый тоннель (Горьковская → Свободы):
              <div class="stage-progress-container" style="margin-top:3px;">
                <div class="stage-progress-fill" style="width:${t.percent}%"></div>
              </div>
              <div class="stage-progress-text">${t.done} / ${t.total} колец (${t.percent}%)</div>
            </div>`;
          }
          if (tunnelInfo.right) {
            const t = tunnelInfo.right;
            const statusText = t.started
              ? t.done > 0
                ? `пройдено ${t.done} из ${t.total} колец`
                : "проходка начата, данных о прогрессе нет"
              : "ожидает начала";
            const rightProgress = t.percent != null ? t.percent : 0;
            tHtml += `<div class="stage-text" style="margin-bottom:6px;">
              Правый тоннель (Горьковская → Свободы):
              <div class="stage-progress-container" style="margin-top:3px;">
                <div class="stage-progress-fill" style="width:${rightProgress}%"></div>
              </div>
              <div class="stage-progress-text">${statusText} — щит «Алёна»</div>
            </div>`;
          }
          if (tunnelInfo.toSvobody) {
            tHtml += `<div class="stage-text">
              Тоннели до «Площади Свободы»:
              <div style="font-size:11px; color:#4caf50; margin-top:2px; font-weight:600;">✅ Построены (2 из 2)</div>
            </div>`;
          }
          html += `<div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>🛠️ Проходка тоннелей</span>
              <span class="arrow">▶</span>
            </div>
            <div class="acc-body">${tHtml}</div>
          </div>`;
        }

        html += "</div>";
        return html;
      }

      function createMarker(station, lineColor) {
        if (createdMarkers[station.name]) return;

        const info = getStatusInfo(station.status);
        let bgColor = "#9e9e9e";
        if (station.status === "open") bgColor = "#4caf50";
        if (station.status === "building") bgColor = "#ff9800";

        const icon = L.divIcon({
          className: "custom-marker",
          html: `<div style="
                    width: 28px; height: 28px;
                    background: ${bgColor};
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 14px;
                ">${info.icon}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });

        const marker = L.marker([station.lat, station.lng], { icon }).addTo(
          map,
        );

        let lineDisplay =
          station.line ||
          (lineColor === "#e30613"
            ? "Автозаводская"
            : lineColor === "#0066cc"
              ? "Сормовско-Мещерская"
              : "Строящаяся");

        let popupContent = `
                <div class="popup-title">${info.icon} ${station.name}</div>
                <div class="popup-line">Линия: <b style="color:${lineColor}">${lineDisplay}</b></div>
                <span class="popup-status ${info.cls}">${info.label}</span>
            `;

        if (station.status === "building") {
          const p = station.progress || 0;
          popupContent += `
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${p}%"></div>
                    </div>
                    <div class="progress-text">${p}% завершено</div>
                `;

          if (station.stages) {
            popupContent += buildAccordion(station.stages, station.tunnelInfo);
          }

          if (station.detail) {
            popupContent += `<div class="popup-note" style="border-top: 1px solid #eee; margin-top: 8px; padding-top: 6px; color: #666;">${station.detail}</div>`;
          }

          if (station.outlook) {
            popupContent += `<div class="popup-outlook">🔮 ${station.outlook}</div>`;
          }

          popupContent += `<div class="popup-year">Ожидаемый год открытия: ${station.year || "—"}</div>`;
          popupContent += `<div class="popup-note">Данные на сентябрь 2026 г.</div>`;
        }

        marker.bindPopup(popupContent, {
          className: "station-popup",
          minWidth: 320,
          maxWidth: 380,
          autoPan: true,
          autoPanPadding: [20, 20],
        });
        createdMarkers[station.name] = marker;
      }

      const stationCoords = {};
      lines.forEach((line) =>
        line.stations.forEach((s) => {
          stationCoords[s.name] = [s.lat, s.lng];
        }),
      );

      function coords(name) {
        const c = stationCoords[name];
        if (!c) console.warn("⚠️ Нет координат для станции:", name);
        return c;
      }

      function buildLinePath(line) {
        const pts = [];
        line.stations.forEach((s, i) => {
          if (i > 0 && Array.isArray(s.viaBefore)) {
            s.viaBefore.forEach((p) => pts.push(p));
          }
          pts.push([s.lat, s.lng]);
        });
        return pts;
      }

      function pointAlong(from, to, t) {
        return [
          from[0] + (to[0] - from[0]) * t,
          from[1] + (to[1] - from[1]) * t,
        ];
      }

      function offsetLine(from, to, meters) {
        const latMid = (from[0] + to[0]) / 2;
        const cosLat = Math.cos((latMid * Math.PI) / 180);
        const dx = (to[1] - from[1]) * cosLat;
        const dy = to[0] - from[0];
        const len = Math.hypot(dx, dy) || 1;
        const px = -dy / len;
        const py = dx / len;
        const degPerMeter = 1 / 111320;
        const dLat = py * meters * degPerMeter;
        const dLng = (px * meters * degPerMeter) / cosLat;
        return [
          [from[0] + dLat, from[1] + dLng],
          [to[0] + dLat, to[1] + dLng],
        ];
      }

      function offsetPath(path, meters) {
        if (!meters || path.length < 2) return path;
        const segs = [];
        for (let i = 0; i < path.length - 1; i++) {
          segs.push(offsetLine(path[i], path[i + 1], meters));
        }
        const result = [segs[0][0]];
        for (let i = 0; i < segs.length - 1; i++) {
          const end = segs[i][1];
          const start = segs[i + 1][0];
          result.push([(end[0] + start[0]) / 2, (end[1] + start[1]) / 2]);
        }
        result.push(segs[segs.length - 1][1]);
        return result;
      }

      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return [
          0.5 *
            (2 * p1[0] +
              (-p0[0] + p2[0]) * t +
              (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
              (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 *
            (2 * p1[1] +
              (-p0[1] + p2[1]) * t +
              (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
              (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ];
      }

      function smoothPath(path, samplesPerSegment = 16) {
        if (!path || path.length < 3) return path;
        const pts = [path[0], ...path, path[path.length - 1]];
        const result = [];
        for (let i = 1; i < pts.length - 2; i++) {
          const p0 = pts[i - 1];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2];
          for (let j = 0; j < samplesPerSegment; j++) {
            result.push(catmullRom(p0, p1, p2, p3, j / samplesPerSegment));
          }
        }
        result.push(path[path.length - 1]);
        return result;
      }

      function pathMetrics(path) {
        const segs = [];
        let total = 0;
        for (let i = 0; i < path.length - 1; i++) {
          const latMid = (path[i][0] + path[i + 1][0]) / 2;
          const cosLat = Math.cos((latMid * Math.PI) / 180);
          const dx = (path[i + 1][1] - path[i][1]) * cosLat;
          const dy = path[i + 1][0] - path[i][0];
          const len = Math.hypot(dx, dy);
          segs.push(len);
          total += len;
        }
        return { segs, total };
      }

      function pointAlongPath(path, t) {
        const { segs, total } = pathMetrics(path);
        if (total === 0) return path[0];
        let target = total * t;
        for (let i = 0; i < segs.length; i++) {
          if (target <= segs[i]) {
            const localT = segs[i] === 0 ? 0 : target / segs[i];
            return pointAlong(path[i], path[i + 1], localT);
          }
          target -= segs[i];
        }
        return path[path.length - 1];
      }

      function splitPath(path, t) {
        const { segs, total } = pathMetrics(path);
        let target = total * t;
        const done = [path[0]];
        const rest = [];
        let split = false;
        for (let i = 0; i < segs.length; i++) {
          if (split) {
            rest.push(path[i + 1]);
            continue;
          }
          if (target >= segs[i]) {
            done.push(path[i + 1]);
            target -= segs[i];
          } else {
            const localT = segs[i] === 0 ? 0 : target / segs[i];
            const mid = pointAlong(path[i], path[i + 1], localT);
            done.push(mid);
            rest.push(mid, path[i + 1]);
            split = true;
          }
        }
        return { done, rest };
      }

      const ROUND_STYLE = { lineCap: "round", lineJoin: "round" };
      const SMOOTH_SAMPLES = 16;

      // ============================================================
      // СМЕЩЕНИЕ ТОННЕЛЕЙ ОТНОСИТЕЛЬНО ОСЕВОЙ ЛИНИИ
      // Чем меньше значение — тем ближе тоннели друг к другу.
      // ============================================================
      const TUNNEL_OFFSET_METERS = 6;

      const ROUTE_BASE_ZOOM = 13;
      const routeLayers = [];

      map.createPane("routeCasing");
      map.getPane("routeCasing").style.zIndex = 390;

      function registerRouteLayer(layer, baseWeight, baseOpacity, kind) {
        routeLayers.push({ layer, baseWeight, baseOpacity, kind });
      }

      function routeZoomFactor(zoom) {
        const extra = Math.max(0, zoom - ROUTE_BASE_ZOOM);
        return Math.min(2, 1 + extra * 0.2);
      }

      function updateRouteWeights() {
        const zoom = map.getZoom();
        const f = routeZoomFactor(zoom);
        const extra = Math.max(0, zoom - ROUTE_BASE_ZOOM);

        routeLayers.forEach(({ layer, baseWeight, baseOpacity, kind }) => {
          const weight =
            kind === "casing" ? baseWeight * f + 4 : baseWeight * f;

          const style = { weight };

          if (baseOpacity != null && baseOpacity < 1) {
            const boost = Math.min(0.6, extra * 0.15);
            style.opacity = Math.min(
              1,
              baseOpacity + (1 - baseOpacity) * boost,
            );
          }

          layer.setStyle(style);
        });
      }

      function addCasedPolyline(path, options) {
        if (!path || path.length < 2) return null;
        const weight = options.weight || 5;
        const opacity = options.opacity != null ? options.opacity : 1;
        const outlineWeight = weight + 4;

        const casing = L.polyline(path, {
          pane: "routeCasing",
          color: "#ffffff",
          weight: outlineWeight,
          opacity: 0.95,
          ...ROUND_STYLE,
        }).addTo(map);
        registerRouteLayer(casing, weight, 0.95, "casing");

        const main = L.polyline(path, {
          ...ROUND_STYLE,
          ...options,
        }).addTo(map);
        registerRouteLayer(main, weight, opacity, "main");

        return main;
      }

      const shieldIcon = L.divIcon({
        className: "shield-marker",
        html: `<div style="
                  width: 16px; height: 16px;
                  background: #ff5722;
                  border-radius: 50%;
                  border: 3px solid white;
                  box-shadow: 0 0 0 3px rgba(255,87,34,0.35);
              "></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      });

      // ============================================================
      // ТОННЕЛИ (актуализировано на 13.09.2026)
      //
      // ВАЖНО: offsetLine при положительном значении смещает линию
      // ВЛЕВО относительно направления from → to.
      // Поэтому:
      //   левый тоннель  → +TUNNEL_OFFSET_METERS
      //   правый тоннель → -TUNNEL_OFFSET_METERS
      // ============================================================
      const tunnels = [
        {
          id: "left",
          from: "Горьковская",
          to: "Площадь Свободы",
          color: "#ff9800",
          weight: 5,
          offset: TUNNEL_OFFSET_METERS,
          progress: { done: 270, total: 485 },
          shield: { name: "Евдокия", atEnd: true },
          label: "Левый тоннель (Горьковская → Пл. Свободы)",
        },
        {
          id: "right",
          from: "Горьковская",
          to: "Площадь Свободы",
          color: "#0066cc",
          weight: 2,
          offset: -TUNNEL_OFFSET_METERS,
          started: true,
          // Данных о прогрессе нет — щит «Алёна» начал проходку, но точное число колец не публиковалось
          progress: { done: 0, total: 486 },
          shield: { name: "Алёна", atEnd: true },
          label: "Правый тоннель (Горьковская → Пл. Свободы)",
        },
        {
          id: "sennaya-svobody",
          from: "Площадь Свободы",
          to: "Сенная",
          via: [
            [56.319052, 44.020148],
            [56.31993, 44.029098],
            [56.321361, 44.032442],
            [56.322385, 44.034482],
          ],
          color: "#4caf50",
          weight: 4,
          complete: true,
          label: "Тоннели между «Сенной» и «Площадью Свободы» — построены ✅",
        },
      ];

      function buildTunnelPath(t) {
        const from = coords(t.from);
        const to = coords(t.to);
        if (!from || !to) return null;
        const via = (t.via || [])
          .map((p) => (Array.isArray(p) ? p : coords(p)))
          .filter(Boolean);
        return [from, ...via, to];
      }

      tunnels.forEach((t) => {
        let path = buildTunnelPath(t);
        if (!path) return;

        if (t.offset) path = offsetPath(path, t.offset);
        path = smoothPath(path, SMOOTH_SAMPLES);

        const percent = t.progress
          ? Math.round((t.progress.done / t.progress.total) * 100)
          : 0;

        if (t.complete) {
          addCasedPolyline(path, {
            color: t.color,
            weight: t.weight,
            opacity: 0.8,
          }).bindPopup(t.label);
          return;
        }

        if (t.progress && t.progress.done > 0) {
          const t01 = t.progress.done / t.progress.total;
          const { done, rest } = splitPath(path, t01);
          const donePoint = pointAlongPath(path, t01);

          addCasedPolyline(done, {
            color: t.color,
            weight: t.weight,
            opacity: 0.9,
          }).bindPopup(
            `${t.label}<br>Пройдено ${t.progress.done} из ${t.progress.total} колец (${percent}%)`,
          );

          if (rest.length > 1) {
            addCasedPolyline(rest, {
              color: t.color,
              weight: 3,
              opacity: 0.5,
              dashArray: "10, 10",
            }).bindPopup(`${t.label}: оставшийся участок`);
          }

          if (t.shield?.atEnd) {
            L.marker(donePoint, { icon: shieldIcon })
              .addTo(map)
              .bindPopup(
                `🛠️ Щит «${t.shield.name}» — текущее положение<br>` +
                  `Пройдено ${t.progress.done} из ${t.progress.total} колец (${percent}%)`,
              );
          }
          return;
        }

        if (t.started) {
          const shieldPart = t.shield ? `щитом «${t.shield.name}» ` : "";
          const statusText =
            t.progress && t.progress.done > 0
              ? `Пройдено ${t.progress.done} из ${t.progress.total} колец`
              : "Проходка начата, данных о прогрессе нет";
          addCasedPolyline(path, {
            color: t.color,
            weight: t.weight,
            opacity: 0.5,
            dashArray: "5, 8",
          }).bindPopup(`${t.label}<br>${statusText} (${shieldPart}начата)`);
        }
      });

      lines
        .filter((l) => l.name !== "Строящиеся станции")
        .forEach((line) => {
          const control = buildLinePath(line);
          const smooth = smoothPath(control, SMOOTH_SAMPLES);
          addCasedPolyline(smooth, {
            color: line.color,
            weight: 5,
            opacity: 0.7,
          });
        });

      lines.forEach((line) => {
        line.stations.forEach((station) => {
          createMarker(station, line.color);
        });
      });

      map.on("zoomend", updateRouteWeights);
      updateRouteWeights();

      console.log("=== МЕТРО НИЖНЕГО НОВГОРОДА (данные на 13.09.2026) ===");
      console.log("Действующие линии:");
      console.log("  • Автозаводская (красная) — 11 станций");
      console.log("  • Сормовско-Мещерская (синяя) — 5 станций");
      console.log("  • Пересадка: «Московская» (кроссплатформенная)");
      console.log("");
      console.log("Строительство:");
      console.log(
        "  • Левый тоннель (Горьковская → Пл. Свободы): 270/485 колец (56%) — щит «Евдокия»",
      );
      console.log(
        "  • Правый тоннель (Горьковская → Пл. Свободы): проходка начата, данных о прогрессе нет — щит «Алёна»",
      );
      console.log("  • Тоннели Сенная ↔ Пл. Свободы: построены (2 из 2, 100%)");
      console.log("");
      console.log("Актуализированные проценты прогресса (13.09.2026):");
      console.log("  • Площадь Свободы: 25% (обвязочная балка завершена)");
      console.log(
        "  • Сенная: 35% (стены и обвязочная балка готовы, идут перекрытия 65%)",
      );
      console.log("  • Сормовская: 12% (изъято 93% объектов, снос гаражей)");
    </script>
  </body>
</html>
