<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Метро Нижнего Новгорода — Прогресс строительства</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 1000;
      }
      #header h1 {
        font-size: 22px;
        font-weight: 600;
      }
      #header .subtitle {
        font-size: 13px;
        opacity: 0.7;
        margin-top: 2px;
      }
      #legend {
        display: flex;
        gap: 20px;
        font-size: 13px;
      }
      #legend .item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.green {
        background: #4caf50;
      }
      .dot.orange {
        background: #ff9800;
      }
      .dot.gray {
        background: #9e9e9e;
      }
      .dot.blue {
        background: #0066cc;
      }
      #map {
        width: 100vw;
        height: calc(100vh - 60px);
      }
      .station-popup .leaflet-popup-content-wrapper {
        border-radius: 12px;
        padding: 4px;
      }
      .station-popup .leaflet-popup-content {
        margin: 12px;
        min-width: 260px;
      }
      .popup-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .popup-line {
        font-size: 13px;
        color: #555;
        margin-bottom: 4px;
      }
      .popup-status {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        color: white;
        margin-top: 6px;
      }
      .popup-status.open {
        background: #4caf50;
      }
      .popup-status.building {
        background: #ff9800;
      }
      .popup-status.planned {
        background: #9e9e9e;
      }
      .progress-bar-container {
        margin-top: 10px;
        background: #e0e0e0;
        border-radius: 10px;
        height: 10px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #ff9800, #ffb74d);
        transition: width 0.5s ease;
      }
      .progress-bar-fill.blue {
        background: linear-gradient(90deg, #0066cc, #4d94ff);
      }
      .progress-text {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
        text-align: right;
      }
      .popup-year {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
      }
      .popup-note {
        font-size: 11px;
        color: #999;
        margin-top: 8px;
        border-top: 1px solid #eee;
        padding-top: 6px;
      }
      .leaflet-popup-content {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div>
        <h1>🚇 Метро Нижнего Новгорода</h1>
        <div class="subtitle">Интерактивная карта прогресса строительства</div>
      </div>
      <div id="legend">
        <div class="item"><span class="dot green"></span> Работает</div>
        <div class="item"><span class="dot orange"></span> Строится</div>
        <div class="item"><span class="dot gray"></span> В проекте</div>
      </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map("map", {
        zoomControl: true,
        attributionControl: true,
      }).setView([56.31, 43.97], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 18,
      }).addTo(map);

      // ============================================================
      // РЕАЛЬНЫЕ ДАННЫЕ О МЕТРО НИЖНЕГО НОВГОРОДА
      // ============================================================

      const lines = [
        {
          name: "Автозаводская",
          color: "#e30613",
          stations: [
            { name: "Горьковская", lat: 56.31389, lng: 43.995, status: "open" },
            {
              name: "Московская",
              lat: 56.321013,
              lng: 43.948439,
              status: "open",
              // Промежуточные точки между «Горьковской» и «Московской»
              // (порядок — от «Горьковской» к «Московской»)
              viaBefore: [
                [56.312466, 43.985568],
                [56.317124, 43.970363],
                [56.318297, 43.966882],
                [56.322347, 43.956084],
                [56.321664, 43.951322],
              ],
            },
            {
              name: "Чкаловская",
              lat: 56.31139,
              lng: 43.93778,
              status: "open",
            },
            { name: "Ленинская", lat: 56.29803, lng: 43.93753, status: "open" },
            { name: "Заречная", lat: 56.28512, lng: 43.92763, status: "open" },
            {
              name: "Двигатель Революции",
              lat: 56.27583,
              lng: 43.92056,
              status: "open",
            },
            {
              name: "Пролетарская",
              lat: 56.26556,
              lng: 43.9125,
              status: "open",
            },
            {
              name: "Автозаводская",
              lat: 56.25806,
              lng: 43.90194,
              status: "open",
            },
            { name: "Комсомольская", lat: 56.2525, lng: 43.89, status: "open" },
            { name: "Кировская", lat: 56.24778, lng: 43.87833, status: "open" },
            {
              name: "Парк культуры",
              lat: 56.2425,
              lng: 43.85889,
              status: "open",
            },
          ],
        },
        {
          name: "Сормовско-Мещерская",
          color: "#0066cc",
          stations: [
            {
              name: "Буревестник",
              lat: 56.33331,
              lng: 43.8946,
              status: "open",
            },
            {
              name: "Бурнаковская",
              lat: 56.32536,
              lng: 43.91336,
              status: "open",
            },
            {
              name: "Канавинская",
              lat: 56.32057,
              lng: 43.9267,
              status: "open",
            },
            {
              name: "Московская",
              lat: 56.322485,
              lng: 43.954706,
              status: "open",
            },
            { name: "Стрелка", lat: 56.33529, lng: 43.94956, status: "open" },
          ],
        },
        {
          name: "Строящиеся станции",
          color: "#ff9800",
          stations: [
            {
              name: "Площадь Свободы",
              lat: 56.31782,
              lng: 44.013717,
              status: "building",
              progress: 40,
              year: "~2027",
              line: "Автозаводская",
              tunnelInfo: {
                left: { done: 270, total: 485, percent: 56 },
                right: { done: 0, total: 486, percent: 0, started: true },
              },
            },
            {
              name: "Сенная",
              lat: 56.32237,
              lng: 44.03726,
              status: "building",
              progress: 35,
              year: "~2027",
              line: "Автозаводская",
              tunnelInfo: {
                toSvobody: { done: 2, total: 2, percent: 100 },
              },
            },
            {
              name: "Сормовская",
              lat: 56.3522,
              lng: 43.8738,
              status: "building",
              progress: 5,
              year: "~2029",
              line: "Сормовско-Мещерская",
            },
          ],
        },
      ];

      function getStatusInfo(status) {
        switch (status) {
          case "open":
            return { label: "Открыта", cls: "open", icon: "✅" };
          case "building":
            return { label: "Строится", cls: "building", icon: "🚧" };
          case "planned":
            return { label: "В проекте", cls: "planned", icon: "📋" };
        }
      }

      const createdMarkers = {};

      function createMarker(station, lineColor) {
        if (createdMarkers[station.name]) return;

        const info = getStatusInfo(station.status);
        let bgColor = "#9e9e9e";
        if (station.status === "open") bgColor = "#4caf50";
        if (station.status === "building") bgColor = "#ff9800";

        const icon = L.divIcon({
          className: "custom-marker",
          html: `<div style="
                    width: 28px; height: 28px;
                    background: ${bgColor};
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 14px;
                ">${info.icon}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });

        const marker = L.marker([station.lat, station.lng], { icon }).addTo(
          map,
        );

        let lineDisplay =
          station.line ||
          (lineColor === "#e30613"
            ? "Автозаводская"
            : lineColor === "#0066cc"
              ? "Сормовско-Мещерская"
              : "Строящаяся");

        let popupContent = `
                <div class="popup-title">${info.icon} ${station.name}</div>
                <div class="popup-line">Линия: <b style="color:${lineColor}">${lineDisplay}</b></div>
                <span class="popup-status ${info.cls}">${info.label}</span>
            `;

        if (station.status === "building") {
          const p = station.progress || 0;
          popupContent += `
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${p}%"></div>
                    </div>
                    <div class="progress-text">${p}% завершено</div>
                `;

          if (station.tunnelInfo) {
            popupContent += `<div style="margin-top: 10px; font-size: 12px; color: #555; font-weight: 600;">Проходка тоннелей:</div>`;

            if (station.tunnelInfo.left) {
              const t = station.tunnelInfo.left;
              popupContent += `
                            <div style="font-size: 12px; color: #444; margin-top: 4px;">
                                Левый тоннель (Горьковская → Свободы):
                                <div class="progress-bar-container" style="height: 8px; margin-top: 2px;">
                                    <div class="progress-bar-fill" style="width: ${t.percent}%;"></div>
                                </div>
                                <div style="font-size: 11px; color: #666; text-align: right; margin-top: 2px;">
                                    ${t.done} / ${t.total} колец (${t.percent}%)
                                </div>
                            </div>
                        `;
            }

            if (station.tunnelInfo.right) {
              const t = station.tunnelInfo.right;
              const statusText = t.started
                ? "проходка начата"
                : "ожидает начала";
              popupContent += `
                            <div style="font-size: 12px; color: #444; margin-top: 6px;">
                                Правый тоннель (Горьковская → Свободы):
                                <div style="font-size: 11px; color: #666; margin-top: 2px;">
                                    ${statusText}, план: ${t.total} колец
                                </div>
                            </div>
                        `;
            }

            if (station.tunnelInfo.toSvobody) {
              popupContent += `
                            <div style="font-size: 12px; color: #444; margin-top: 6px;">
                                Тоннели до «Площади Свободы»:
                                <div style="font-size: 11px; color: #4caf50; margin-top: 2px; font-weight: 600;">
                                    ✅ Построены (2 из 2)
                                </div>
                            </div>
                        `;
            }
          }

          popupContent += `<div class="popup-year">Ожидаемый год открытия: ${station.year || "—"}</div>`;
          popupContent += `<div class="popup-note">Данные на сентябрь 2026 г.</div>`;
        }

        marker.bindPopup(popupContent, { className: "station-popup" });
        createdMarkers[station.name] = marker;
      }

      // ============================================================
      // ЕДИНЫЙ ИСТОЧНИК КООРДИНАТ (DRY)
      // ============================================================
      const stationCoords = {};
      lines.forEach((line) =>
        line.stations.forEach((s) => {
          stationCoords[s.name] = [s.lat, s.lng];
        }),
      );

      function coords(name) {
        const c = stationCoords[name];
        if (!c) console.warn("⚠️ Нет координат для станции:", name);
        return c;
      }

      // ============================================================
      // СБОРКА ПОЛИЛИНИИ ЛИНИИ С УЧЁТОМ viaBefore У СТАНЦИЙ
      // ============================================================
      function buildLinePath(line) {
        const pts = [];
        line.stations.forEach((s, i) => {
          if (i > 0 && Array.isArray(s.viaBefore)) {
            s.viaBefore.forEach((p) => pts.push(p));
          }
          pts.push([s.lat, s.lng]);
        });
        return pts;
      }

      // ============================================================
      // ГЕОМЕТРИЯ
      // ============================================================
      function pointAlong(from, to, t) {
        return [
          from[0] + (to[0] - from[0]) * t,
          from[1] + (to[1] - from[1]) * t,
        ];
      }

      function offsetLine(from, to, meters) {
        const latMid = (from[0] + to[0]) / 2;
        const cosLat = Math.cos((latMid * Math.PI) / 180);
        const dx = (to[1] - from[1]) * cosLat;
        const dy = to[0] - from[0];
        const len = Math.hypot(dx, dy) || 1;
        const px = -dy / len;
        const py = dx / len;
        const degPerMeter = 1 / 111320;
        const dLat = py * meters * degPerMeter;
        const dLng = (px * meters * degPerMeter) / cosLat;
        return [
          [from[0] + dLat, from[1] + dLng],
          [to[0] + dLat, to[1] + dLng],
        ];
      }

      function offsetPath(path, meters) {
        if (!meters || path.length < 2) return path;
        const segs = [];
        for (let i = 0; i < path.length - 1; i++) {
          segs.push(offsetLine(path[i], path[i + 1], meters));
        }
        const result = [segs[0][0]];
        for (let i = 0; i < segs.length - 1; i++) {
          const end = segs[i][1];
          const start = segs[i + 1][0];
          result.push([(end[0] + start[0]) / 2, (end[1] + start[1]) / 2]);
        }
        result.push(segs[segs.length - 1][1]);
        return result;
      }

      // ------------------------------------------------------------
      // Сглаживание ломаной сплайном Catmull-Rom.
      // Кривая проходит точно через все исходные точки,
      // но между ними — плавный изгиб вместо углов.
      // ------------------------------------------------------------
      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return [
          0.5 *
            (2 * p1[0] +
              (-p0[0] + p2[0]) * t +
              (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
              (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 *
            (2 * p1[1] +
              (-p0[1] + p2[1]) * t +
              (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
              (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ];
      }

      function smoothPath(path, samplesPerSegment = 16) {
        if (!path || path.length < 3) return path;
        const pts = [path[0], ...path, path[path.length - 1]];
        const result = [];
        for (let i = 1; i < pts.length - 2; i++) {
          const p0 = pts[i - 1];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2];
          for (let j = 0; j < samplesPerSegment; j++) {
            result.push(catmullRom(p0, p1, p2, p3, j / samplesPerSegment));
          }
        }
        result.push(path[path.length - 1]);
        return result;
      }

      function pathMetrics(path) {
        const segs = [];
        let total = 0;
        for (let i = 0; i < path.length - 1; i++) {
          const latMid = (path[i][0] + path[i + 1][0]) / 2;
          const cosLat = Math.cos((latMid * Math.PI) / 180);
          const dx = (path[i + 1][1] - path[i][1]) * cosLat;
          const dy = path[i + 1][0] - path[i][0];
          const len = Math.hypot(dx, dy);
          segs.push(len);
          total += len;
        }
        return { segs, total };
      }

      function pointAlongPath(path, t) {
        const { segs, total } = pathMetrics(path);
        if (total === 0) return path[0];
        let target = total * t;
        for (let i = 0; i < segs.length; i++) {
          if (target <= segs[i]) {
            const localT = segs[i] === 0 ? 0 : target / segs[i];
            return pointAlong(path[i], path[i + 1], localT);
          }
          target -= segs[i];
        }
        return path[path.length - 1];
      }

      function splitPath(path, t) {
        const { segs, total } = pathMetrics(path);
        let target = total * t;
        const done = [path[0]];
        const rest = [];
        let split = false;
        for (let i = 0; i < segs.length; i++) {
          if (split) {
            rest.push(path[i + 1]);
            continue;
          }
          if (target >= segs[i]) {
            done.push(path[i + 1]);
            target -= segs[i];
          } else {
            const localT = segs[i] === 0 ? 0 : target / segs[i];
            const mid = pointAlong(path[i], path[i + 1], localT);
            done.push(mid);
            rest.push(mid, path[i + 1]);
            split = true;
          }
        }
        return { done, rest };
      }

      // ============================================================
      // ДАННЫЕ О ТОННЕЛЯХ
      // ============================================================
      const shieldIcon = L.divIcon({
        className: "shield-marker",
        html: `<div style="
                  width: 16px; height: 16px;
                  background: #ff5722;
                  border-radius: 50%;
                  border: 3px solid white;
                  box-shadow: 0 0 0 3px rgba(255,87,34,0.35);
              "></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      });

      // Общие настройки для скруглённых концов и стыков линий
      const ROUND_STYLE = {
        lineCap: "round",
        lineJoin: "round",
      };

      // Сколько подточек добавлять на каждый сегмент при сглаживании.
      const SMOOTH_SAMPLES = 16;

      const tunnels = [
        {
          id: "left",
          from: "Горьковская",
          to: "Площадь Свободы",
          color: "#ff9800",
          weight: 5,
          progress: { done: 270, total: 485 },
          shield: { name: "Евдокия", atEnd: true },
          label: "Левый тоннель (Горьковская → Пл. Свободы)",
        },
        {
          id: "right",
          from: "Горьковская",
          to: "Площадь Свободы",
          color: "#0066cc",
          weight: 2,
          offset: 18,
          started: true,
          total: 486,
          shield: { name: "Алёна" },
          label: "Правый тоннель (Горьковская → Пл. Свободы)",
        },
        {
          id: "sennaya-svobody",
          from: "Площадь Свободы",
          to: "Сенная",
          via: [
            [56.319052, 44.020148],
            [56.31993, 44.029098],
            [56.321361, 44.032442],
            [56.322385, 44.034482],
          ],
          color: "#4caf50",
          weight: 4,
          complete: true,
          label: "Тоннели между «Сенной» и «Площадью Свободы» — построены ✅",
        },
      ];

      function buildTunnelPath(t) {
        const from = coords(t.from);
        const to = coords(t.to);
        if (!from || !to) return null;
        const via = (t.via || [])
          .map((p) => (Array.isArray(p) ? p : coords(p)))
          .filter(Boolean);
        return [from, ...via, to];
      }

      // ============================================================
      // ОТРИСОВКА ТОННЕЛЕЙ
      // ============================================================
      tunnels.forEach((t) => {
        let path = buildTunnelPath(t);
        if (!path) return;

        if (t.offset) path = offsetPath(path, t.offset);
        path = smoothPath(path, SMOOTH_SAMPLES);

        const percent = t.progress
          ? Math.round((t.progress.done / t.progress.total) * 100)
          : 0;

        if (t.complete) {
          L.polyline(path, {
            color: t.color,
            weight: t.weight,
            opacity: 0.8,
            ...ROUND_STYLE,
          })
            .addTo(map)
            .bindPopup(t.label);
          return;
        }

        if (t.progress) {
          const t01 = t.progress.done / t.progress.total;
          const { done, rest } = splitPath(path, t01);
          const donePoint = pointAlongPath(path, t01);

          L.polyline(done, {
            color: t.color,
            weight: t.weight,
            opacity: 0.9,
            ...ROUND_STYLE,
          })
            .addTo(map)
            .bindPopup(
              `${t.label}<br>Пройдено ${t.progress.done} из ${t.progress.total} колец (${percent}%)`,
            );

          if (rest.length > 1) {
            L.polyline(rest, {
              color: t.color,
              weight: 3,
              opacity: 0.5,
              dashArray: "10, 10",
              ...ROUND_STYLE,
            })
              .addTo(map)
              .bindPopup(`${t.label}: оставшийся участок`);
          }

          if (t.shield?.atEnd) {
            L.marker(donePoint, { icon: shieldIcon })
              .addTo(map)
              .bindPopup(
                `🛠️ Щит «${t.shield.name}» — текущее положение<br>` +
                  `Пройдено ${t.progress.done} из ${t.progress.total} колец (${percent}%)`,
              );
          }
          return;
        }

        if (t.started) {
          const shieldPart = t.shield ? `щитом «${t.shield.name}» ` : "";
          const totalPart = t.total ? `, план: ${t.total} колец` : "";
          L.polyline(path, {
            color: t.color,
            weight: t.weight,
            opacity: 0.5,
            dashArray: "5, 8",
            ...ROUND_STYLE,
          })
            .addTo(map)
            .bindPopup(
              `${t.label}<br>Проходка ${shieldPart}начата${totalPart}`,
            );
        }
      });

      // Рисуем действующие линии метро (со сглаживанием и скруглением)
      lines
        .filter((l) => l.name !== "Строящиеся станции")
        .forEach((line) => {
          const control = buildLinePath(line);
          const smooth = smoothPath(control, SMOOTH_SAMPLES);
          L.polyline(smooth, {
            color: line.color,
            weight: 5,
            opacity: 0.7,
            ...ROUND_STYLE,
          }).addTo(map);
        });

      // Добавляем станции
      lines.forEach((line) => {
        line.stations.forEach((station) => {
          createMarker(station, line.color);
        });
      });

      // ============================================================
      // СТАТИСТИКА
      // ============================================================
      console.log("=== МЕТРО НИЖНЕГО НОВГОРОДА ===");
      console.log("Действующие линии:");
      console.log("  • Автозаводская (красная) — 11 станций");
      console.log("  • Сормовско-Мещерская (синяя) — 5 станций");
      console.log("  • Пересадка: «Московская» (кроссплатформенная)");
      console.log("");
      console.log("Строительство:");
      console.log(
        "  • Левый тоннель (Горьковская → Пл. Свободы): 270/485 колец (56%)",
      );
      console.log(
        "  • Правый тоннель (Горьковская → Пл. Свободы): проходка начата (июль 2026)",
      );
      console.log(
        "  • Тоннели Сенная ↔ Пл. Свободы: построены (плавный изгиб)",
      );
      console.log(
        "  • Станции «Пл. Свободы» и «Сенная»: откроются в 2027 году",
      );
      console.log("");
      console.log(
        "Источник данных: новости от 11.09.2026 (щит «Евдокия» на трассе Горьковская → Пл. Свободы)",
      );
    </script>
  </body>
